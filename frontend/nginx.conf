server {
    listen 2000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Browser transcription weights, VAD and ORT runtime files. Same-origin by
    # design (env.allowRemoteModels = false), and a missing asset must fail as a
    # missing file: without this block /stt/... falls through to the SPA
    # fallback below and returns index.html, which the model loaders then report
    # as an opaque inference failure.
    location /stt/ {
        try_files $uri =404;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public";
    }

    # No cache for index.html (always fresh)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
