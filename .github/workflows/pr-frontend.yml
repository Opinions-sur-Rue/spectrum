name: PR Frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build:
    # Keep native browser dependencies on a Playwright-supported distribution.
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📁 Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: 🔍 Lint code
        working-directory: frontend
        run: |
          npx prettier --check src e2e && npx eslint src --max-warnings 0

      - name: 🧪 Run tests 
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test

      - name: 🛠 Build application
        working-directory: frontend
        run: |
          npm run build

      - name: 🔎 Svelte Check
        working-directory: frontend
        run: |
          npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
